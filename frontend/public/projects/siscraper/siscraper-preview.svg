<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b0b0c"/>

  <text x="60" y="80" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#e6e6e6">siscraper</text>
  <text x="60" y="110" font-family="system-ui,sans-serif" font-size="15" fill="#4a4a55">a scraper that gets better at its job every time it runs</text>

  <!-- Left: the order you guess -->
  <rect x="60" y="160" width="440" height="330" rx="12" fill="#111115" stroke="#2a2a35" stroke-width="1.5"/>
  <text x="90" y="200" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#a1a1aa" letter-spacing="0.06em">FIRST RUN — PATHS IN GUESSED ORDER</text>

  <text x="90" y="248" font-family="monospace" font-size="18" fill="#e6e6e6">/affiliates</text>
  <text x="90" y="284" font-family="monospace" font-size="18" fill="#e6e6e6">/affiliate-program</text>
  <text x="90" y="320" font-family="monospace" font-size="18" fill="#e6e6e6">/referral-program</text>
  <text x="90" y="356" font-family="monospace" font-size="18" fill="#e6e6e6">/partner-program</text>
  <text x="90" y="392" font-family="monospace" font-size="18" fill="#e6e6e6">/partners</text>
  <text x="90" y="428" font-family="monospace" font-size="18" fill="#4a4a55">…9 more</text>
  <text x="90" y="464" font-family="system-ui,sans-serif" font-size="14" fill="#4a4a55">13 requests per host, in the order a human imagined</text>

  <!-- Arrow -->
  <line x1="510" y1="325" x2="670" y2="325" stroke="#2a2a35" stroke-width="2"/>
  <polygon points="670,318 688,325 670,332" fill="#2a2a35"/>
  <text x="596" y="308" font-family="monospace" font-size="13" fill="#4a6080" text-anchor="middle">130 sweeps</text>
  <text x="596" y="352" font-family="monospace" font-size="13" fill="#4a6080" text-anchor="middle">counted</text>

  <!-- Right: the order the data gives -->
  <rect x="700" y="160" width="440" height="330" rx="12" fill="#111115" stroke="#3d5a3d" stroke-width="1.5"/>
  <text x="730" y="200" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#8fbf8f" letter-spacing="0.06em">AFTER — PATHS IN MEASURED ORDER</text>

  <text x="730" y="248" font-family="monospace" font-size="18" fill="#e6e6e6">/affiliates</text>
  <text x="1110" y="248" font-family="monospace" font-size="18" fill="#8fbf8f" text-anchor="end">31</text>
  <text x="730" y="284" font-family="monospace" font-size="18" fill="#e6e6e6">/partners</text>
  <text x="1110" y="284" font-family="monospace" font-size="18" fill="#8fbf8f" text-anchor="end">27</text>
  <text x="730" y="320" font-family="monospace" font-size="18" fill="#e6e6e6">/affiliate-program</text>
  <text x="1110" y="320" font-family="monospace" font-size="18" fill="#8fbf8f" text-anchor="end">22</text>
  <text x="730" y="356" font-family="monospace" font-size="18" fill="#e6e6e6">/affiliate</text>
  <text x="1110" y="356" font-family="monospace" font-size="18" fill="#8fbf8f" text-anchor="end">15</text>
  <text x="730" y="392" font-family="monospace" font-size="18" fill="#4a4a55">/referral-program</text>
  <text x="1110" y="392" font-family="monospace" font-size="18" fill="#4a4a55" text-anchor="end">1</text>
  <text x="730" y="428" font-family="monospace" font-size="18" fill="#4a4a55">…8 more</text>
  <text x="1110" y="428" font-family="monospace" font-size="18" fill="#4a4a55" text-anchor="end">0</text>
  <text x="730" y="464" font-family="system-ui,sans-serif" font-size="14" fill="#4a4a55">wins per path, recomputed from the run log</text>

  <!-- Bottom line -->
  <text x="60" y="546" font-family="system-ui,sans-serif" font-size="17" fill="#a1a1aa">/partners was guessed fifth. Measured, it is second.</text>
  <text x="60" y="576" font-family="system-ui,sans-serif" font-size="15" fill="#4a4a55">It also remembers which hosts block it, and carries the rules that counting cannot discover.</text>

  <text x="1140" y="576" font-family="monospace" font-size="14" fill="#4a6080" text-anchor="end">Python · stdlib only · MIT</text>
</svg>
