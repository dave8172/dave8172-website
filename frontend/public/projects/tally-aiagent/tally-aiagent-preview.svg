<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b0b0c"/>

  <!-- Top label -->
  <text x="60" y="80" font-family="system-ui,sans-serif" font-size="32" font-weight="700" fill="#e6e6e6">tally-aiagent</text>
  <text x="60" y="110" font-family="system-ui,sans-serif" font-size="15" fill="#4a4a55">a safety gate for agent writes to Tally Prime</text>

  <!-- Box 1: what the agent asks for -->
  <rect x="60" y="150" width="270" height="200" rx="12" fill="#111115" stroke="#2a2a35" stroke-width="1.5"/>
  <text x="195" y="196" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="0.06em">AGENT ASKS</text>
  <text x="195" y="238" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#e6e6e6" text-anchor="middle">A name</text>
  <text x="195" y="276" font-family="monospace" font-size="12" fill="#f59e0b" text-anchor="middle">'ACME SUPPLIES CO. LTD'</text>
  <text x="195" y="310" font-family="system-ui,sans-serif" font-size="12" fill="#4a4a55" text-anchor="middle">plausible. never checked.</text>

  <!-- Arrow 1 -->
  <line x1="330" y1="250" x2="415" y2="250" stroke="#2a2a35" stroke-width="2"/>
  <polygon points="415,244 430,250 415,256" fill="#2a2a35"/>

  <!-- Box 2: the gate -->
  <rect x="430" y="130" width="290" height="240" rx="12" fill="#0f1a1a" stroke="#134e4a" stroke-width="1.5"/>
  <rect x="430" y="130" width="290" height="5" rx="2" fill="#0d9488"/>
  <text x="575" y="186" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="middle" letter-spacing="0.06em">THE GATE</text>
  <text x="575" y="228" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#e6e6e6" text-anchor="middle">Tally's own masters</text>
  <text x="575" y="262" font-family="system-ui,sans-serif" font-size="12" fill="#134e4a" text-anchor="middle">no default ledger names, anywhere</text>
  <text x="575" y="300" font-family="monospace" font-size="12" fill="#0d9488" text-anchor="middle">exact → matched → ambiguous</text>
  <text x="575" y="322" font-family="monospace" font-size="12" fill="#0d9488" text-anchor="middle">→ not found</text>

  <!-- Arrow 2 -->
  <line x1="720" y1="250" x2="800" y2="250" stroke="#2a2a35" stroke-width="2"/>
  <polygon points="800,244 815,250 800,256" fill="#2a2a35"/>

  <!-- Box 3: the two outcomes -->
  <rect x="815" y="150" width="325" height="95" rx="12" fill="#111115" stroke="#14532d" stroke-width="1.5"/>
  <text x="845" y="192" font-family="system-ui,sans-serif" font-size="20" fill="#4ade80">✓</text>
  <text x="875" y="192" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6e6e6">Posted, then read back</text>
  <text x="875" y="218" font-family="monospace" font-size="12" fill="#4ade80">stored == intended</text>

  <rect x="815" y="255" width="325" height="95" rx="12" fill="#111115" stroke="#4c1d24" stroke-width="1.5"/>
  <text x="845" y="297" font-family="system-ui,sans-serif" font-size="20" fill="#f87171">✕</text>
  <text x="875" y="297" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e6e6e6">Refused, nothing sent</text>
  <text x="875" y="323" font-family="monospace" font-size="12" fill="#f87171">no master was created</text>

  <!-- Bottom row -->
  <line x1="60" y1="410" x2="1140" y2="410" stroke="#1a1a1f" stroke-width="1"/>

  <text x="230" y="455" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#4a4a55" text-anchor="middle">WHAT TALLY DOES ALONE</text>
  <text x="230" y="490" font-family="monospace" font-size="13" fill="#f59e0b" text-anchor="middle">unknown name → new master</text>
  <text x="230" y="514" font-family="monospace" font-size="13" fill="#f59e0b" text-anchor="middle">CREATED=1 → "success"</text>
  <text x="230" y="540" font-family="system-ui,sans-serif" font-size="12" fill="#4a4a55" text-anchor="middle">one supplier, two balances</text>

  <line x1="430" y1="418" x2="430" y2="548" stroke="#1a1a1f" stroke-width="1"/>

  <text x="620" y="455" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#4a4a55" text-anchor="middle">TWO STEPS, NOT ONE</text>
  <text x="620" y="490" font-family="monospace" font-size="12" fill="#a1a1aa" text-anchor="middle">prepare → a report a human reads</text>
  <text x="620" y="514" font-family="monospace" font-size="12" fill="#a1a1aa" text-anchor="middle">post → takes only a passed draft</text>
  <text x="620" y="540" font-family="system-ui,sans-serif" font-size="12" fill="#4a4a55" text-anchor="middle">structural, not a rule to follow</text>

  <line x1="810" y1="418" x2="810" y2="548" stroke="#1a1a1f" stroke-width="1"/>

  <text x="975" y="455" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#4a4a55" text-anchor="middle">OPEN SOURCE</text>
  <text x="975" y="492" font-family="monospace" font-size="13" fill="#2dd4bf" text-anchor="middle">pip install tally-aiagent</text>
  <text x="975" y="522" font-family="system-ui,sans-serif" font-size="12" fill="#4a4a55" text-anchor="middle">github.com/dave8172/tally-aiagent</text>
</svg>
